# Host TLS reverse proxy example, NOT installed by Compose.
# Replace demo.example.test and certificate paths only after domain/cert approval.
server {
    listen 80;
    server_name demo.example.test;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name demo.example.test;
    ssl_certificate /etc/letsencrypt/live/demo.example.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
