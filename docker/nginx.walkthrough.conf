server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index portfolio.html;
    autoindex off;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    location = /health { default_type text/plain; return 200 'walkthrough_read_only\n'; }
    location ~ ^/(api|admin|reset)(/|$) { return 404; }
    location / { try_files $uri $uri/ =404; }
}
