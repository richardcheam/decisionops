# Local read-only evaluation sites. No Commerce API, staff worker or database.
services:
  site-a:
    image: node:24-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
    command: [node, /fixture/browser-investigation/fixtures/server.mjs]
    environment: {FIXTURE_SITE: a}
    volumes: ['./browser-investigation/fixtures:/fixture/browser-investigation/fixtures:ro', './runs/browser-investigation/dist:/dist:ro']
    ports: ['127.0.0.1:8096:8080']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
  site-b:
    image: node:24-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
    command: [node, /fixture/browser-investigation/fixtures/server.mjs]
    environment: {FIXTURE_SITE: b}
    volumes: ['./browser-investigation/fixtures:/fixture/browser-investigation/fixtures:ro', './runs/browser-investigation/dist:/dist:ro']
    ports: ['127.0.0.1:8097:8080']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
