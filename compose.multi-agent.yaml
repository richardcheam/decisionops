# Isolated fictional demo overlay; use only with project decisionops-multi-agent-demo.
# Base Dockerfiles reuse locked local dependencies and build with network: none.
services:
  init:
    image: decisionops-multi-agent-app:local
  api:
    image: decisionops-multi-agent-app:local
    environment:
      COMMERCE_STAFF_INVESTIGATION_MODE: mock-specialists
      COMMERCE_ORIGINS: http://127.0.0.1:8123
  worker:
    image: decisionops-multi-agent-app:local
  staff-investigator:
    image: decisionops-multi-agent-app:local
  web:
    image: decisionops-multi-agent-web:local
    ports: !override ["127.0.0.1:8123:8080"]
