[project]
name = "decisionops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gliclass==0.1.20",
    "huggingface-hub>=1.5,<2.0",
    "laya==0.3.20",
    "torch==2.14.0",
    "transformers==5.17.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
commerce = [
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]>=3.2,<4",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "fastapi>=0.130,<1",
    "uvicorn>=0.40,<1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
