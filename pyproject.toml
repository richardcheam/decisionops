[project]
name = "decisionops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gliclass==0.1.20",
    "huggingface-hub>=1.5,<2.0",
    "laya==0.3.20",
    "torch==2.14.0",
    "transformers==5.17.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
