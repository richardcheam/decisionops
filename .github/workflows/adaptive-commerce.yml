name: Verify adaptive commerce without models
on:
  push:
    branches: [feat/commerce-adaptive-recovery]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adaptive-commerce-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: python -B -S scripts/commerce_ci_tests.py dependency-free
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_DB: commerce
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: ci-fictional-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      COMMERCE_TEST_DATABASE_URL: postgresql+psycopg://commerce:ci-fictional-only@127.0.0.1:5432/commerce
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: python -m pip install 'uv==0.12.19'
      - run: uv sync --locked --only-group commerce --no-python-downloads
      - run: .venv/bin/python -B scripts/commerce_ci_tests.py postgres
