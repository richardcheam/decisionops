name: Verify and deploy workflow viewer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up supported Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Run model-free test suite
        run: python -m unittest discover -s tests

      - name: Export the committed report as the site index
        run: |
          rm -rf runs/pages-site
          mkdir -p runs/pages-site
          python -m decisionops workflow export-html \
            --report-dir reports/workflow-model-comparison-20260927 \
            --output runs/pages-site/index.html
          python - <<'PY'
          from pathlib import Path

          site = Path("runs/pages-site")
          files = [path.relative_to(site).as_posix() for path in site.rglob("*") if path.is_file()]
          assert files == ["index.html"], f"unexpected Pages output: {files!r}"
          html = (site / "index.html").read_text(encoding="utf-8")
          for notice in ("Offline synthetic simulation", "uncalibrated"):
              assert notice in html, f"required viewer notice missing: {notice}"
          PY

      - name: Upload generated site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: runs/pages-site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v5
