name: Verify commerce without models

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/commerce-eligibility, feat/commerce-fake-provider, feat/commerce-local-providers]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commerce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Standard-library checks; report every optional skip
        run: python -B -S scripts/commerce_ci_tests.py dependency-free
      - name: Frozen regression report (zero inference)
        run: |
          mkdir -p runs
          python -B -S -m decisionops.commerce.evaluation --output runs/commerce-regression-v1-report.json

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_DB: commerce
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: ci-fictional-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      COMMERCE_TEST_DATABASE_URL: postgresql+psycopg://commerce:ci-fictional-only@127.0.0.1:5432/commerce
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install pinned package manager
        run: python -m pip install 'uv==0.12.19'
      - name: Install locked commerce-only profile
        run: uv sync --locked --only-group commerce --no-python-downloads
      - name: Required database tests (any skip fails)
        run: .venv/bin/python -B scripts/commerce_ci_tests.py postgres
      - name: Historical and pure regressions (optional model skips reported)
        run: .venv/bin/python -B -m unittest discover -s tests -v
      - name: Approved execution and stale-approval recovery
        run: .venv/bin/python -B scripts/commerce_execution_walkthrough.py
      - name: Simulated provider routing, budget and restart recovery
        run: .venv/bin/python -B scripts/commerce_provider_walkthrough.py
      - name: Model-free optional local-provider failures and recovery
        run: .venv/bin/python -B scripts/commerce_local_provider_failures.py
      - name: Durable worker and checkpoint recovery
        run: .venv/bin/python -B scripts/commerce_worker_walkthrough.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMMERCE_TEST_DATABASE_URL: postgresql+psycopg://commerce:local-demo-only@127.0.0.1:55432/commerce
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install pinned package manager and locked commerce profile
        run: |
          python -m pip install 'uv==0.12.19'
          uv sync --locked --only-group commerce --no-python-downloads
      - name: Build locked app, interface and browser runner
        run: |
          python -B scripts/commerce_local_setup.py
          docker compose --profile app build
          docker build -f docker/Dockerfile.browser -t decisionops-commerce-browser:local .
      - name: Start PostgreSQL; migrate, seed, and await app readiness
        run: |
          docker compose --profile app up -d --wait
          curl --fail http://127.0.0.1:8080/health
      - name: Real browser workflow (zero skipped tests required)
        run: .venv/bin/python -B scripts/commerce_browser_walkthrough.py
      - name: Restore a backup in a separate database
        run: python -B scripts/commerce_backup_walkthrough.py
      - name: Recover failed configuration and database outage
        run: python -B scripts/commerce_release_walkthrough.py
      - name: Stop stack; preserve diagnostics, never export credentials or dumps
        if: always()
        run: docker compose --profile app down
