name: Verify commerce without models

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commerce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-free:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Standard-library checks; report every optional skip
        run: python -B -S scripts/commerce_ci_tests.py dependency-free
      - name: Frozen regression report (zero inference)
        run: |
          mkdir -p runs
          python -B -S -m decisionops.commerce.evaluation --output runs/commerce-regression-v1-report.json

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_DB: commerce_decisions_test
          POSTGRES_USER: commerce_decisions
          POSTGRES_PASSWORD: ci-fictional-only
        ports: [55446:5432]
        options: >-
          --health-cmd "pg_isready -U commerce_decisions -d commerce_decisions_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      COMMERCE_TEST_DATABASE_URL: postgresql+psycopg://commerce_decisions:ci-fictional-only@127.0.0.1:55446/commerce_decisions_test
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install pinned package manager
        run: python -m pip install 'uv==0.12.19'
      - name: Install locked commerce-only profile
        run: uv sync --locked --only-group commerce --only-group commerce-api --no-python-downloads
      - name: Backup, restore and reconcile with PostgreSQL 16 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          .venv/bin/python -B scripts/commerce_portfolio_restore.py --pg-bin /usr/lib/postgresql/16/bin
      - name: Required database tests (any skip fails)
        run: .venv/bin/python -B scripts/commerce_ci_tests.py postgres
      - name: API SDK mocks and PostgreSQL accounting (no external requests)
        run: |
          .venv/bin/python -B -m unittest discover -s tests -p 'test_commerce_api_*.py' -v
          .venv/bin/python -B -m unittest discover -s tests -p 'test_commerce_decisions_*.py' -v
          .venv/bin/python -B -m unittest discover -s tests -p 'test_commerce_staff_investigation.py' -v
      - name: Historical and pure regressions (optional model skips reported)
        run: .venv/bin/python -B -m unittest discover -s tests -v
      - name: Approved execution and stale-approval recovery
        run: .venv/bin/python -B scripts/commerce_execution_walkthrough.py
      - name: Simulated provider routing, budget and restart recovery
        run: .venv/bin/python -B scripts/commerce_provider_walkthrough.py
      - name: Model-free optional local-provider failures and recovery
        run: .venv/bin/python -B scripts/commerce_local_provider_failures.py
      - name: Durable worker and checkpoint recovery
        run: .venv/bin/python -B scripts/commerce_worker_walkthrough.py

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Browser regressions on fresh local fixtures
        run: |
          npm --prefix frontend ci
          (cd frontend && npx playwright install --with-deps chromium)
          .venv/bin/python -B scripts/commerce_delivery_browser.py
      - name: Compare supported actions with simulated model choices
        run: .venv/bin/python -B -m decisionops.commerce.customer_evaluation --simulate-adapter
      - name: Compare delivery decisions and restart behavior on PostgreSQL
        env:
          COMMERCE_COMPARISON_POSTGRES: '1'
        run: .venv/bin/python -B -m unittest discover -s tests -p test_commerce_comparison.py -v
