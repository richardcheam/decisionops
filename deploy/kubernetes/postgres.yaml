apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
  selector: {app: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres, app.kubernetes.io/part-of: decisionops}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
          ports: [{containerPort: 5432, name: postgres}]
          env:
            - {name: POSTGRES_DB, value: portfolio}
            - {name: POSTGRES_USER, value: portfolio}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: decisionops-credentials, key: POSTGRES_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            exec: {command: [pg_isready, -U, portfolio, -d, portfolio]}
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            exec: {command: [pg_isready, -U, portfolio, -d, portfolio]}
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
