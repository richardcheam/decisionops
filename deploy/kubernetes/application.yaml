apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/part-of: decisionops
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: api
        image: decisionops-github-demo-app:local
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: decisionops-config
        - secretRef:
            name: decisionops-credentials
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        app.kubernetes.io/part-of: decisionops
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: worker
        image: decisionops-github-demo-app:local
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: decisionops-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        command:
        - python
        - -B
        - -m
        - decisionops.commerce.worker
        - run
        env:
        - name: COMMERCE_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: decisionops-credentials
              key: COMMERCE_DATABASE_URL
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staff-investigator
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: staff-investigator
  template:
    metadata:
      labels:
        app: staff-investigator
        app.kubernetes.io/part-of: decisionops
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: staff-investigator
        image: decisionops-github-demo-app:local
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: decisionops-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        command:
        - python
        - -B
        - -m
        - decisionops.commerce.staff_investigations
        - --step-delay
        - '0.1'
        env:
        - name: COMMERCE_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: decisionops-credentials
              key: COMMERCE_DATABASE_URL
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/part-of: decisionops
    spec:
      automountServiceAccountToken: false
      containers:
      - name: web
        image: decisionops-github-demo-web:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 2
        volumeMounts:
        - name: nginx
          mountPath: /etc/nginx/conf.d
          readOnly: true
      volumes:
      - name: nginx
        configMap:
          name: decisionops-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
  - name: http
    port: 8080
    targetPort: http
