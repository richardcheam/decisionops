apiVersion: batch/v1
kind: Job
metadata:
  name: decisionops-migrate
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels: {app: decisionops-migrate, app.kubernetes.io/part-of: decisionops}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: migrate
          image: decisionops-github-demo-app:local
          imagePullPolicy: IfNotPresent
          command: [sh, -c, "alembic upgrade head && python -B -m decisionops.commerce.seed && python -B -m decisionops.commerce.delivery_seed && python -B -m decisionops.commerce.customer_seed && python -B -m decisionops.commerce.worker setup"]
          envFrom:
            - configMapRef: {name: decisionops-config}
          env:
            - name: COMMERCE_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: decisionops-credentials, key: COMMERCE_DATABASE_URL}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 32Mi}}]
